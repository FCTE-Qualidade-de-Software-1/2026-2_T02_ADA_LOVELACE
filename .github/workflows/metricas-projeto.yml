name: Coletar métricas do GitHub Projects

on:
  # O cron semanal permite repetir a coleta quando uma execução falha; o script
  # só grava um novo CSV quando já se passaram pelo menos 14 dias.
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas-projeto
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar métricas do Project
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/collect_project_metrics.py

      - name: Salvar CSV no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gestao/dados/lead-cycle-time.csv docs/gestao/dados/lead-cycle-time.last-collected
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas métricas para salvar."
          else
            git commit -m "docs: atualizar métricas de fluxo"
            git push
          fi
