name: Adicionar issue ao Kanban

# Garante que toda issue nova entre no Kanban (Project #19 da organização).
# Criado quando o quadro era um Project de usuário, cujo auto-add não aceita
# repositórios da organização; desde 23/11/2026 o quadro voltou ao #19 e o
# workflow ficou como reforço do auto-add nativo (a ação não duplica cartões).
on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  adicionar:
    runs-on: ubuntu-latest
    env:
      TEM_KANBAN_TOKEN: ${{ secrets.KANBAN_TOKEN != '' }}
    steps:
      - name: Adicionar ao Project
        if: env.TEM_KANBAN_TOKEN == 'true'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/FCTE-Qualidade-de-Software-1/projects/19
          github-token: ${{ secrets.KANBAN_TOKEN }}

      - name: Avisar ausência do KANBAN_TOKEN
        if: env.TEM_KANBAN_TOKEN != 'true'
        run: echo "::warning::Secret KANBAN_TOKEN não cadastrado; a issue não foi adicionada ao Kanban."
