name: Atualizar métricas dos membros

on:
  schedule:
    - cron: "27 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar commits por autor
        env:
          METRICS_REF: main
        run: python scripts/collect_member_metrics.py

      - name: Salvar CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gestao/dados/membros-commits.csv docs/analise/gestao-grupo.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas métricas dos membros."
          else
            git commit -m "docs: atualizar métricas dos membros"
            git push
          fi
