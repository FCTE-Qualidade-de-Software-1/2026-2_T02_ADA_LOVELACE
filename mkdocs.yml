site_name: Análise de Qualidades de Software
site_description: Documentação da análise de qualidades de software do projeto Ada Lovelace
site_author: Equipe Ada Lovelace
repo_name: 2026-2_T02_ADA_LOVELACE
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_ADA_LOVELACE

theme:
  name: material
  language: pt-BR
  font: false
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Metodologia:
      - Metodologia: metodologia.md
      - Priorização de qualidades: priorizacao.md
  - Fase de Planejamento:
      - Propósito e partes interessadas: fase1/proposito-partes-interessadas.md
      - Modelo de qualidade: fase1/modelo-qualidade.md
      - ODS: fase1/ods.md
      - Objetivos de qualidade: fase1/objetivos-qualidade.md
  - Análise:
      - Roteiro da análise: analise/roteiro.md
      - Resultados: analise/resultados.md
  - Gestão:
      - Métricas de desenvolvimento: gestao/metricas.md
      - Estimativa de custos: gestao/estimativa-custos.md
  - Referências: referencias.md
  - Uso de IA: uso-ia.md
