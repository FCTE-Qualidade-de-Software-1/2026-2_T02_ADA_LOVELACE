          - S-M4 · Dados persistidos localmente sem criptografia: resultados/seguranca/s-m4.md
          - S-M5 · Detecção de adulteração: resultados/seguranca/s-m5.md
          - S-M6 · Edição simultânea: resultados/seguranca/s-m6.md
