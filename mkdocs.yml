          - CI-M15 · Ações destrutivas sem confirmação: resultados/capacidade-interacao/ci-m15.md
          - CI-M16 · Perda de dados ao fechar ou recarregar: resultados/capacidade-interacao/ci-m16.md
          - CI-M17 · Taxa de erro do usuário: resultados/capacidade-interacao/ci-m17.md
          - CI-M18 · Mensagens de erro: resultados/capacidade-interacao/ci-m18.md
