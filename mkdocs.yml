site_name: Análise de Qualidades de Software
site_description: Documentação da análise de qualidades de software do projeto Ada Lovelace
site_author: Equipe Ada Lovelace
repo_name: 2026-2_T02_ADA_LOVELACE
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_ADA_LOVELACE

theme:
  name: material
  language: pt-BR
  font: false
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Metodologia:
      - Metodologia: metodologia.md
      - Priorização de qualidades: priorizacao.md
  - Fase de Planejamento:
      - Propósito e partes interessadas: fase_planejamento/proposito-partes-interessadas.md
      - Modelo de qualidade: fase_planejamento/modelo-qualidade.md
      - ODS: fase_planejamento/ods.md
      - Objetivos de qualidade: fase_planejamento/objetivos-qualidade.md
  - Análise:
      - Roteiro da análise: analise/roteiro.md
      - Gestão do grupo: analise/gestao-grupo.md
      - Resultados: analise/resultados.md
  - Fase de Aplicação:
      - Visão geral: fase_aplicacao/index.md
      - Plano de avaliação: fase_aplicacao/plano-avaliacao.md
      - Segurança: fase_aplicacao/seguranca.md
      - Flexibilidade: fase_aplicacao/flexibilidade.md
      - Capacidade de interação: fase_aplicacao/capacidade-interacao.md
  - Resultados:
      - Visão geral: resultados/index.md
      - Segurança:
          - S-M1 · Mensagens cifradas: resultados/seguranca/s-m1.md
          - S-M2 · Chave enviada ao servidor: resultados/seguranca/s-m2.md
          - S-M9 · Suficiência da autenticação: resultados/seguranca/s-m9.md
          - S-M13 · Cabeçalhos HTTP: resultados/seguranca/s-m13.md
      - Flexibilidade:
          - F-M10 · Formatos de exportação: resultados/flexibilidade/f-m10.md
          - F-M12 · Formatos de importação: resultados/flexibilidade/f-m12.md
      - Capacidade de interação:
          - CI-M18 · Mensagens de erro: resultados/capacidade-interacao/ci-m18.md
          - CI-M26 · Tradução para o português: resultados/capacidade-interacao/ci-m26.md
  - Gestão:
      - Métricas de desenvolvimento: gestao/metricas.md
      - Cronograma: gestao/cronograma.md
      - Estimativa de custos: gestao/estimativa-custos.md
  - Referências: referencias.md
  - Uso de IA: uso-ia.md
