          - CI-M20 · Satisfação visual: resultados/capacidade-interacao/ci-m20.md
          - CI-M21 · Intenção de uso futuro: resultados/capacidade-interacao/ci-m21.md
          - CI-M22 · Violações da WCAG 2.2 (A e AA): resultados/capacidade-interacao/ci-m22.md
          - CI-M23 · Funções operáveis só pelo teclado: resultados/capacidade-interacao/ci-m23.md
          - CI-M24 · Elementos anunciados por leitor de tela: resultados/capacidade-interacao/ci-m24.md
          - CI-M25 · Contraste mínimo de 4,5:1: resultados/capacidade-interacao/ci-m25.md
